<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Accent AI Voice System</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            background:
                radial-gradient(circle at top left,#1e3a8a33,transparent 30%),
                radial-gradient(circle at bottom right,#7c3aed22,transparent 30%),
                #050816;
            color:#f1f5f9;
            min-height:100vh;
            padding:40px 20px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:16px;
        }

        .logo{
            width:62px;
            height:62px;
            border-radius:18px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:26px;
            font-weight:700;
            box-shadow:0 0 30px rgba(59,130,246,0.35);
        }

        .brand h1{
            font-size:34px;
            font-weight:700;
        }

        .brand p{
            color:#94a3b8;
            margin-top:4px;
            letter-spacing:1px;
        }

        .status{
            padding:12px 20px;
            border-radius:999px;
            background:#0f172a;
            border:1px solid #1e293b;
            color:#93c5fd;
            font-size:14px;
        }

        .glass-card{
            background:rgba(15,23,42,0.75);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter:blur(20px);
            border-radius:28px;
            padding:35px;
            box-shadow:0 0 50px rgba(0,0,0,0.4);
        }

        .mode-switch{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
            margin-bottom:30px;
        }

        .mode-btn{
            padding:18px;
            border-radius:18px;
            border:1px solid #1e293b;
            background:#0f172a;
            color:#94a3b8;
            text-align:center;
            font-weight:600;
            transition:0.3s;
        }

        .mode-btn.active{
            background:linear-gradient(135deg,#2563eb22,#7c3aed22);
            border:1px solid #3b82f6;
            color:#dbeafe;
            box-shadow:0 0 25px rgba(59,130,246,0.25);
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
            margin-bottom:25px;
        }

        .field label{
            display:block;
            margin-bottom:10px;
            color:#94a3b8;
            font-size:14px;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        select,
        textarea{
            width:100%;
            background:#0b1120;
            border:1px solid #1e293b;
            color:#f8fafc;
            border-radius:18px;
            padding:16px;
            font-size:16px;
            outline:none;
            transition:0.3s;
        }

        textarea{
            height:220px;
            resize:none;
            line-height:1.7;
        }

        select:focus,
        textarea:focus{
            border-color:#3b82f6;
            box-shadow:0 0 25px rgba(59,130,246,0.2);
        }

        .emotion-section{
            margin-top:30px;
        }

        .emotion-buttons{
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            margin-top:16px;
        }

        .emotion-btn{
            padding:12px 22px;
            border-radius:14px;
            background:#0b1120;
            border:1px solid #1e293b;
            color:#cbd5e1;
            cursor:pointer;
            transition:0.3s;
            font-size:15px;
        }

        .emotion-btn.active{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            border-color:#60a5fa;
            color:white;
            box-shadow:0 0 20px rgba(59,130,246,0.4);
        }

        .emotion-btn:hover{
            transform:translateY(-2px);
            border-color:#3b82f6;
        }

        .action-row{
            display:flex;
            gap:20px;
            margin-top:35px;
        }

        .generate-btn,
        .clear-btn{
            flex:1;
            padding:18px;
            border:none;
            border-radius:18px;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .generate-btn{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            box-shadow:0 0 30px rgba(59,130,246,0.35);
        }

        .generate-btn:hover{
            transform:translateY(-2px);
        }

        .clear-btn{
            background:#0b1120;
            border:1px solid #1e293b;
            color:#cbd5e1;
        }

        .clear-btn:hover{
            border-color:#3b82f6;
        }

        .audio-section{
            margin-top:40px;
        }

        .audio-card{
            background:#0b1120;
            border:1px solid #1e293b;
            border-radius:22px;
            padding:24px;
            margin-top:18px;
        }

        audio{
            width:100%;
        }

        .footer-grid{
            margin-top:35px;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:18px;
        }

        .mini-card{
            background:#0b1120;
            border:1px solid #1e293b;
            border-radius:18px;
            padding:20px;
        }

        .mini-card h3{
            color:#93c5fd;
            margin-bottom:10px;
            font-size:15px;
        }

        .mini-card p{
            color:#cbd5e1;
            line-height:1.7;
            font-size:14px;
        }

        @media(max-width:900px){

            .grid,
            .footer-grid{
                grid-template-columns:1fr;
            }

            .topbar{
                flex-direction:column;
                gap:20px;
                align-items:flex-start;
            }

            .action-row{
                flex-direction:column;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="topbar">

        <div class="brand">

            <div class="logo">AI</div>

            <div>
                <h1>UK Accent AI Voice System</h1>
                <p>SPEECH SYNTHESIS + WHISPER VALIDATION</p>
            </div>

        </div>

        <div class="status">
            ● System Active
        </div>

    </div>

    <div class="glass-card">

        <div class="mode-switch">

            <div class="mode-btn active">
                🔊 TTS — TEXT TO SPEECH
            </div>

            <div class="mode-btn">
                🎙️ STT — COMING SOON
            </div>

        </div>

        <div class="grid">

            <div class="field">

                <label>Language</label>

                <select>
                    <option>English (UK Accent)</option>
                </select>

            </div>

            <div class="field">

                <label>Voice Profile</label>

                <select id="speaker">
                    <option value="p225">Female Voice</option>
                    <option value="p226">Male Voice</option>
                    <option value="p227">Narrator Voice</option>
                    <option value="p228">Assistant Voice</option>
                </select>

            </div>

        </div>

        <div class="field">

            <label>Enter Text</label>

            <textarea
                id="textInput"
                placeholder="Enter text for UK accent speech generation..."
            ></textarea>

        </div>

        <div class="emotion-section">

            <label style="color:#94a3b8;text-transform:uppercase;font-size:14px;letter-spacing:1px;">
                Voice Emotion
            </label>

            <div class="emotion-buttons">

                <button class="emotion-btn active" onclick="selectEmotion(this)">
                    Normal
                </button>

                <button class="emotion-btn" onclick="selectEmotion(this)">
                    Happy
                </button>

                <button class="emotion-btn" onclick="selectEmotion(this)">
                    Sad
                </button>

                <button class="emotion-btn" onclick="selectEmotion(this)">
                    Angry
                </button>

                <button class="emotion-btn" onclick="selectEmotion(this)">
                    Fear
                </button>

                <button class="emotion-btn" onclick="selectEmotion(this)">
                    Surprise
                </button>

            </div>

        </div>

        <div class="action-row">

            <button class="generate-btn" onclick="generateSpeech()">
                Generate UK Speech
            </button>

            <button class="clear-btn" onclick="clearText()">
                Clear Text
            </button>

        </div>

        <div class="audio-section">

            <label style="color:#94a3b8;text-transform:uppercase;font-size:14px;letter-spacing:1px;">
                Audio Output
            </label>

            <div class="audio-card">
                <audio id="audioPlayer" controls></audio>
            </div>

        </div>

        <div class="footer-grid">

            <div class="mini-card">
                <h3>TTS MODEL</h3>
                <p>Coqui VITS (VCTK UK Accent)</p>
            </div>

            <div class="mini-card">
                <h3>STT MODEL</h3>
                <p>Whisper Large-v3 Validation Backend</p>
            </div>

            <div class="mini-card">
                <h3>SYSTEM STATUS</h3>
                <p>Speech generation active and running successfully.</p>
            </div>

        </div>

    </div>

</div>

<script>

let selectedEmotion = "Normal";

function selectEmotion(button){

    const buttons = document.querySelectorAll(".emotion-btn");

    buttons.forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");

    selectedEmotion = button.innerText;

    console.log("Selected Emotion:", selectedEmotion);
}

async function generateSpeech(){

    const text = document.getElementById("textInput").value;

    const speaker = document.getElementById("speaker").value;

    if(!text){
        alert("Please enter text");
        return;
    }

    const response = await fetch("/tts",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            text:text,
            speaker:speaker,
            emotion:selectedEmotion
        })

    });

    const blob = await response.blob();

    const audioURL = URL.createObjectURL(blob);

    document.getElementById("audioPlayer").src = audioURL;
}

function clearText(){

    document.getElementById("textInput").value = "";

    document.getElementById("audioPlayer").src = "";
}

</script>

</body>
</html>
